<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Nexus Night">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#f3e0b4"/>
      <stop offset="0.45" stop-color="#d3b575"/>
      <stop offset="1" stop-color="#8f7138"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#d3b575" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d3b575" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="120" height="120" rx="27" fill="#0a0a0c"/>
  <rect x="1.5" y="1.5" width="117" height="117" rx="25.5" fill="none" stroke="#2b2318" stroke-width="2"/>
  <circle cx="60" cy="56" r="44" fill="url(#glow)"/>

  <!-- gem -->
  <path d="M60 17 L97 60 L60 103 L23 60 Z" fill="url(#gold)"/>
  <!-- facets: light above the waist, shadow below -->
  <path d="M60 17 L97 60 L60 60 Z" fill="#ffffff" opacity="0.20"/>
  <path d="M60 17 L23 60 L60 60 Z" fill="#ffffff" opacity="0.07"/>
  <path d="M60 60 L97 60 L60 103 Z" fill="#000000" opacity="0.16"/>
  <path d="M60 60 L23 60 L60 103 Z" fill="#000000" opacity="0.30"/>
  <!-- table facet, cut out of the stone -->
  <path d="M60 34 L82 60 L60 86 L38 60 Z" fill="none" stroke="#0a0a0c" stroke-width="3.5" opacity="0.5"/>
  <path d="M23 60 L97 60" stroke="#0a0a0c" stroke-width="2" opacity="0.35"/>
</svg>
